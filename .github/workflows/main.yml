name: Build ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dọn dẹp dung lượng đĩa (Free Disk Space)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Cài đặt môi trường biên dịch (Tương thích Ubuntu AMD64)
        run: |
          sudo apt update -y
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget libpcre3-dev \
            gcc-arm-none-eabi libssl-dev device-tree-compiler u-boot-tools

      - name: Khôi phục Toolchain Cache
        id: cache-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
          key: immortalwrt-toolchain-amd64-${{ hashFiles('feeds.conf.default') }}-v2
          restore-keys: |
            immortalwrt-toolchain-amd64-

      - name: Khôi phục Download Cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: immortalwrt-dl-amd64-${{ hashFiles('feeds.conf.default') }}-v2-${{ github.run_id }}
          restore-keys: |
            immortalwrt-dl-amd64-

      - name: Thực thi 6 câu lệnh Build chuẩn
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp viettel.config .config
          make defconfig
          make download -j8 V=s

          # Build toàn bộ firmware (Tự động build host tools -> tools -> u-boot -> target)
          make -j$(nproc) V=s || make -j1 V=s

      - name: Thu gom file Firmware thành phẩm
        run: |
          mkdir -p dist
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.img*" -o -name "*.itb" -o -name "*.fip" -o -name "sha256sums" \) -exec cp {} dist/ \;

      - name: Tải Firmware lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware-amd64
          path: dist/
          retention-days: 14

      - name: Dọn dẹp bộ nhớ đĩa trước khi lưu Cache
        if: always()
        run: |
          rm -rf build_dir bin tmp logs feeds
          rm -rf staging_dir/target-* staging_dir/packages

      - name: Lưu Toolchain Cache
        if: always() && steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
          key: immortalwrt-toolchain-amd64-${{ hashFiles('feeds.conf.default') }}-v2

      - name: Lưu Download Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: immortalwrt-dl-amd64-${{ hashFiles('feeds.conf.default') }}-v2-${{ github.run_id }}
