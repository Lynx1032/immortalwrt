name: Build ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dọn dẹp dung lượng đĩa (Free Disk Space)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Cài đặt môi trường biên dịch (Tương thích Ubuntu AMD64)
        run: |
          sudo apt update -y
          sudo apt upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build openssl p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons sed squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Khôi phục Toolchain Cache
        id: cache-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
          key: immortalwrt-toolchain-amd64-${{ hashFiles('feeds.conf.default') }}-v3
          restore-keys: |
            immortalwrt-toolchain-amd64-

      - name: Khôi phục Download Cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: immortalwrt-dl-amd64-${{ hashFiles('feeds.conf.default') }}-v3-${{ github.run_id }}
          restore-keys: |
            immortalwrt-dl-amd64-

      - name: Thực thi 6 câu lệnh Build chuẩn
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp viettel.config .config
          make defconfig
          make download -j$(nproc) V=s

          make tools/install -j$(nproc) V=s
          make toolchain/install -j$(nproc) V=s
          make package/install -j$(nproc) V=s
          make target/install -j$(nproc) V=s

          make package/boot/uboot-mediatek/compile -j$(nproc) V=s

          # Build toàn bộ firmware (Tự động build host tools -> tools -> u-boot -> target)
          make -j$(nproc) V=s || make -j1 V=s

      - name: Thu gom file Firmware thành phẩm
        run: |
          mkdir -p dist
          # Quét tất cả file image, sysupgrade, bootloader, fip, u-boot, bin
          find bin/targets/ -type f \( \
            -name "*.bin" -o \
            -name "*.img*" -o \
            -name "*.itb" -o \
            -name "*fip*" -o \
            -name "*bl2*" -o \
            -name "*u-boot*" -o \
            -name "sha256sums" \
          \) -exec cp {} dist/ \;

      - name: Tải Firmware lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware-amd64
          path: dist/
          retention-days: 14

      - name: Dọn dẹp bộ nhớ đĩa trước khi lưu Cache
        if: always()
        run: |
          rm -rf build_dir bin tmp logs feeds
          rm -rf staging_dir/target-* staging_dir/packages

      - name: Lưu Toolchain Cache
        if: always() && steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
          key: immortalwrt-toolchain-amd64-${{ hashFiles('feeds.conf.default') }}-v3

      - name: Lưu Download Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: immortalwrt-dl-amd64-${{ hashFiles('feeds.conf.default') }}-v3-${{ github.run_id }}
